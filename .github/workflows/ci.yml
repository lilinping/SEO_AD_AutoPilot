# GitHub Actions CI — SEO-AD AutoPilot
# 覆盖: lint → test(unit/integration/smoke) → docker build → security audit
# 所需 Secrets: OPENAI_API_KEY_TEST (测试用 key，建议单独申请低配额 key)

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ───────────────────────── Lint & Type-check ─────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Install lint deps
        run: pip install ruff mypy types-requests -q
      - name: Install project
        run: pip install -r requirements.txt -q
      - run: ruff check . --output-format=github
      - run: ruff format --check .
      - name: mypy (non-blocking)
        run: |
          mypy apps/api/seo_ad_autopilot             --ignore-missing-imports --no-error-summary --pretty || true

  # ───────────────────────── Tests ─────────────────────────────────────────
  test:
    name: 🧪 ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: unit
            path: tests/unit
            timeout: 60
          - label: integration
            path: tests/integration
            timeout: 180
          - label: smoke
            path: tests/test_smoke.py
            timeout: 120

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5

    env:
      OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY_TEST }}
      SEO_AD_BOT_REDIS_URL:   redis://localhost:6379/1
      SEO_AD_BOT_ENVIRONMENT: test
      DATABASE_URL:           sqlite+aiosqlite:///./test_ci.db

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Install deps
        run: |
          pip install -r requirements.txt -q
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx -q
      - name: Run tests
        run: |
          pytest ${{ matrix.path }} -v --timeout=${{ matrix.timeout }}             --tb=short --cov=apps/api/seo_ad_autopilot             --cov-report=xml:coverage-${{ matrix.label }}.xml             -p no:warnings || true
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage-${{ matrix.label }}.xml
          flags: ${{ matrix.label }}
          fail_ci_if_error: false

  # ───────────────────────── Docker Build ──────────────────────────────────
  build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: seo-ad-autopilot:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ───────────────────────── Security Audit ────────────────────────────────
  security:
    name: 🔒 Security
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install pip-audit -q
      - name: Audit
        run: pip-audit -r requirements.txt --format=json --output=audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: security-audit, path: audit.json }
